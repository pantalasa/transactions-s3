name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lunar:
    runs-on: ubuntu-latest
    steps:
      - name: Run Lunar CI Agent
        uses: earthly/lunar-ci-action@main
        env:
          LUNAR_HUB_TOKEN: ${{ secrets.LUNAR_HUB_TOKEN }}
          LUNAR_HUB_HOST: lunar.demo.earthly.dev
          LUNAR_LOG_LEVEL: debug
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Validate Terraform
        run: |
          echo "Module syntax validation runs via the Terraform collector."
